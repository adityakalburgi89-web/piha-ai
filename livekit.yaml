# LiveKit SFU Server Configuration for Piha AI
port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50050
  use_external_ip: false

keys:
  devkey: secretkey

room:
  empty_timeout: 10s
  departure_timeout: 20s
  max_participants: 20

audio:
  # Enable audio level detection for live waveform visualizers
  active_level: -30
  min_percent: 0.1
  update_interval: 100ms

logging:
  json: true
  level: info